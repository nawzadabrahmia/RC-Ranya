name: Build RC-Ranya (APK + Windows EXE)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release with the two files

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key from GitHub Secrets (same key every build → updates install over old version)
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > rc-ranya.jks

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Remove signing key from the runner
        if: always()
        run: rm -f android/rc-ranya.jks

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk RC-Ranya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: RC-Ranya.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build single-file EXE
        run: dotnet publish windows/RC-Ranya.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: publish/RC-Ranya.exe

      # a normal Windows installer as well (the portable .exe stays the default)
      - name: Build installer
        shell: pwsh
        env:
          UORRC_VERSION: 1.0.${{ github.run_number }}
        run: |
          choco install innosetup --no-progress -y
          Copy-Item publish/RC-Ranya.exe windows/RC-Ranya.exe -Force
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" /Qp "windows\installer.iss"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: windows/RC-Ranya-Setup.exe
        continue-on-error: true

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RC-Ranya v1.0.${{ github.run_number }}
          body: |
            📱 **RC-Ranya.apk** → install on the Android phone
            💻 **RC-Ranya.exe** → portable: just run it (recommended)
            🧩 **RC-Ranya-Setup.exe** → normal installer, if you prefer Start-menu / desktop shortcuts
          files: |
            dist/RC-Ranya.apk
            dist/RC-Ranya.exe
            dist/RC-Ranya-Setup.exe
